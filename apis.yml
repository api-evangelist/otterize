aid: otterize
name: Otterize
description: >-
  Otterize is an open-source, Kubernetes-native platform for intent-based access
  control (IBAC). Application teams declare which services need to talk to which
  other services using ClientIntents, and Otterize automatically calculates,
  provisions, and enforces the underlying access controls: Kubernetes
  NetworkPolicies, AWS/GCP/Azure IAM, Istio Authorization Policies, Kafka ACLs,
  and MySQL/PostgreSQL grants. It ships three open-source operators (intents
  operator, credentials operator, network mapper) deployed via Helm, a Go CLI,
  and a managed Otterize Cloud. Its developer surface is the CLI, Kubernetes
  Custom Resources, and Helm/Terraform tooling rather than a public REST API.
  Otterize was surfaced as an Index Ventures portfolio company; otterize.com now
  redirects to Cyera following acquisition, while the open-source components,
  documentation, and CLI remain live.
