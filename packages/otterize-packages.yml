    language: go
    registry: homebrew
    name: otterize-cli
    tap: otterize/otterize
    url: https://github.com/otterize/homebrew-otterize
    install: brew install otterize/otterize/otterize-cli
    version: 2.0.3
    license: Apache-2.0
    official: true
  - kind: cli
    language: go
    registry: scoop
    name: otterize-cli
    bucket: https://github.com/otterize/scoop-otterize-cli
    url: https://github.com/otterize/scoop-otterize-cli
    install: |
      scoop bucket add otterize-cli https://github.com/otterize/scoop-otterize-cli
      scoop install otterize-cli
    official: true
  - kind: cli
    language: go
    registry: github-releases
    name: otterize-cli
    url: https://github.com/otterize/otterize-cli/releases
