note: >-
  Otterize ships no client-library SDKs. Its first-party distributables are the
  open-source CLI (Homebrew/Scoop/GitHub-release binaries), the Helm charts for
  the operators, and Terraform modules. All are cataloged here as Packages; none
  qualify as a language SDK, so no SDKs pointer is emitted.
packages:
